spring:
  application:
    name: xybjz-app-lite
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./lottery-app/.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${app.infra.mysql.host}:${app.infra.mysql.port}/marketing_lite?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${app.infra.mysql.username}
    password: ${app.infra.mysql.password}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Lottery_HikariCP
      minimum-idle: 15
      idle-timeout: 180000
      maximum-pool-size: 25
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

server:
  port: 8091
  servlet:
    context-path: /api/v1
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 200
      min-spare: 50
    accept-count: 100
    max-connections: 200

thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

redis:
  sdk:
    config:
      host: ${app.infra.redis.host}
      port: ${app.infra.redis.port}
      password: ${app.infra.redis.password}
      database: ${app.infra.redis.database}
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 10000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

logging:
  config: classpath:logback-spring.xml

dubbo:
  application:
    name: lottery_lite
    version: 1.0
  registry:
    id: nacos-registry
    address: nacos://${app.infra.nacos.host}:${app.infra.nacos.port}
  protocol:
    name: tri
    port: -1
  consumer:
    check: false
    timeout: 5000
    retries: 1

auth:
  tenant-id: ${app.auth.tenant-id}
  refresh-token-prefix: "lottery_lite:refresh_token:"
  refresh-token-ttl-days: 7

authing:
  app-id: ${app.authing.app-id}
  app-secret: ${app.authing.app-secret}
  app-host: ${app.authing.app-host}

alioss:
  endpoint: ${app.infra.alioss.endpoint}
  accessKeyId: ${app.infra.alioss.access-key-id}
  accessKeySecret: ${app.infra.alioss.access-key-secret}
  bucketName: ${app.infra.alioss.bucket-name}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true


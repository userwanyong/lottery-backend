dataSourceKey: marketing_01
destination: example
groupId: g1
esMapping:
  _index: marketing.activity_account
  _id: _id
sql: "SELECT 
        id AS _id,
        user_id AS _user_id,
        activity_id AS _activity_id,
        total_count AS _total_count,
        total_count_surplus AS _total_count_surplus,
        day_count AS _day_count,
        day_count_surplus AS _day_count_surplus,
        month_count AS _month_count,
        month_count_surplus AS _month_count_surplus,
        create_time AS _create_time,
        update_time AS _update_time 
      FROM activity_account t"
etlCondition: "WHERE t.update_time >= {}"
commitBatch: 3000
# 命令执行 docker-compose -f docker-compose-app.yml up -d
services:
  xybjz-app:
    image: wanyj/xybjz-app:5.0
    container_name: xybjz-app
    restart: always
    ports:
      - "8091:8091"
    volumes:
      - ./log:/data/log
      - ./log/xybjz:/log/xybjz
    environment:
      JAVA_OPTS: >
        -Xms2G -Xmx2G -XX:+UseG1GC -Xss256k
        -Xlog:gc*:file=/log/xybjz/gc.log:time,tid,tags,level:filecount=5,filesize=100M
        -XX:+DisableExplicitGC
        -XX:MaxMetaspaceSize=512m
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/log/xybjz/heapdump.hprof
      PARAMS: ""
      # 应用配置以环境变量注入（Spring Boot 宽松绑定：APP_INFRA_MYSQL_HOST -> app.infra.mysql.host）
      # 部署以本文件为准，容器内不再依赖 .env 文件
      # MySQL：连接 docker-compose-environment.yml 中的 mysql 服务（同网络容器名，root/123456，库 marketing_lite）
      APP_INFRA_MYSQL_HOST: mysql
      APP_INFRA_MYSQL_PORT: "3306"
      APP_INFRA_MYSQL_USERNAME: root
      APP_INFRA_MYSQL_PASSWORD: change-me
      # Redis：redis.conf 中 requirepass wanyj，轻量版独立使用 db 7
      APP_INFRA_REDIS_HOST: redis
      APP_INFRA_REDIS_PORT: "6379"
      APP_INFRA_REDIS_PASSWORD: change-me
      APP_INFRA_REDIS_DATABASE: "7"
      # Nacos：外部注册中心（environment 编排中 nacos 已注释），用于发现 auth-service
      APP_INFRA_NACOS_HOST: 127.0.0.1
      APP_INFRA_NACOS_PORT: "8848"
      # Auth：auth-service 租户与 RPC 鉴权；回调基地址请改为线上可访问的前端地址
      APP_AUTH_TENANT_UID: change-me
      APP_AUTH_RPC_TOKEN: change-me
      APP_AUTH_FRONTEND_BASE_URL: http://localhost:8000
      # 阿里云 OSS
      APP_INFRA_ALIOSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
      APP_INFRA_ALIOSS_ACCESS_KEY_ID: change-me
      APP_INFRA_ALIOSS_ACCESS_KEY_SECRET: change-me
      APP_INFRA_ALIOSS_BUCKET_NAME: change-me
    networks:
      - my-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  my-network:
    driver: bridge

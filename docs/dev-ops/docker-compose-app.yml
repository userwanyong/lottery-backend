# 命令执行 docker-compose -f docker-compose-app.yml up -d
services:
  xybjz-app:
    image: wanyj/xybjz-app:1.0
    container_name: xybjz-app
    restart: always
    ports:
      - "8091:8091"
#    environment:
#      - TZ=PRC
#      - SERVER_PORT=8091
#      - APP_CONFIG_API_VERSION=v1
#      - APP_CONFIG_CROSS_ORIGIN=*
#      - SPRING_DATASOURCE_USERNAME=root
#      - SPRING_DATASOURCE_PASSWORD=123456
#      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/marketing?serverTimezone=UTC&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai
#      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
#      - SPRING_HIKARI_POOL_NAME=Retail_HikariCP
#      - REDIS_SDK_CONFIG_HOST=redis
#      - REDIS_SDK_CONFIG_PORT=6379
    volumes:
      - ./log:/data/log
    networks:
      - my-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  xybjz-front:
    container_name: xybjz-front
    image: wanyj/xybjz-front:1.0
    restart: always
    networks:
      - my-network
    ports:
      - "8000:8000"
    environment:
      - UMI_APP_API_HOST=http://127.0.0.1:8091
      - UMI_APP_WS_HOST=ws://127.0.0.1:8091
#      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
#    healthcheck:
#      test: [ "CMD", "wget", "--spider", "-q", "http://0.0.0.0:3000/" ]
#      interval: 1m
#      timeout: 10s
#      retries: 3

networks:
  my-network:
    driver: bridge
